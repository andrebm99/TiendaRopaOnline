<div class="login-wrapper">
  <!-- Columna Izquierda: Banner de Imagen con filtro fucsia -->
  <div class="login-banner">
    <img src="/img/screen.webp" alt="L&G Fashion Collection" class="banner-img" />
    <div class="banner-overlay"></div>
    <div class="banner-text">
      <p class="season-text">NEW SEASON / VOL. 24</p>
      <h1 class="brand-text">UNAPOLOGETIC</h1>
    </div>
  </div>

  <!-- Columna Derecha: Formulario de Login -->
  <div class="login-form-container">
    <div class="login-form-content">
      <div class="form-logo-container">
        <a routerLink="/">
          <img src="/img/logoTIENDADEROPA.webp" alt="Tienda de Ropa Online" class="form-logo-img">
        </a>
      </div>
      <p class="form-subtitle">INICIA SESIÓN PARA DESBLOQUEAR LOS PRODUCTOS EXCLUSIVOS</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label class="form-label" for="email">CORREO</label>
          <input type="email" id="email" formControlName="email" placeholder="YOU@EXAMPLE.COM" class="form-control"
            [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="password">CONTRASEÑA</label>
            <a href="javascript:void(0)" class="forgot-pass-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="password-input-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
              placeholder="••••••••" class="form-control password-control"
              [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" />
            <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()">
              <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="error-alert" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit" class="login-btn hover-shadow-solid" [disabled]="loginForm.invalid || loading">
          {{ loading ? 'CARGANDO...' : 'INICIAR SESIÓN' }}
        </button>
      </form>

      <!-- Conectarse con -->
      <div class="social-login-section">
        <div class="social-divider">
          <span>CONÉCTATE CON</span>
        </div>
        <div class="social-buttons-grid">
          <!-- ICONOS DE MARCAS -->
          <button type="button" class="social-btn">
            <i class="fa-brands fa-apple"></i>
          </button>
          <button type="button" class="social-btn">
            <i class="fa-brands fa-google"></i>
          </button>
          <button type="button" class="social-btn">
            <i class="fa-brands fa-tiktok"></i>
          </button>
        </div>
      </div>

      <p class="signup-redirect">
        ¿Aún no tienes cuenta? <a routerLink="/auth/signup">Regístrate</a>
      </p>
    </div>
  </div>
</div>
