<div class="signup-wrapper">
  <!-- Barra Lateral Izquierda de Pasos -->
  <div class="steps-sidebar">
    <div class="sidebar-header">
      <a routerLink="/" class="back-link">
        <span class="material-symbols-outlined">arrow_back</span>
        <span class="sidebar-logo">L&G FASHION</span>
      </a>
      <span class="step-counter">1 / 2</span>
    </div>

    <div class="sidebar-body">
      <h3 class="sidebar-title">Pasos a seguir</h3>
      <p class="sidebar-subtitle">RUTA DE CREACIÓN</p>

      <div class="steps-list">
        <div class="step-item active">
          <span class="material-symbols-outlined">person_add</span>
          <span>REGÍSTRATE</span>
        </div>
        <div class="step-item disabled">
          <span class="material-symbols-outlined">check_circle</span>
          <span>CONFIRMAR</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor Derecho del Formulario -->
  <div class="signup-content-container">
    <div class="signup-card">
      <h1 class="signup-card-title">ÚNETE AL CLUB</h1>
      <div class="promo-banner">
        <span>OBTÉN 10% EN TU PRIMERA COMPRA</span>
      </div>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
        <div class="form-group">
          <label class="form-label" for="email">CORREO</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="YOUR@EMAIL.COM" 
            class="form-control"
            [class.is-invalid]="signupForm.get('email')?.touched && signupForm.get('email')?.invalid"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">CONTRASEÑA</label>
          <div class="password-input-wrapper">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              formControlName="password" 
              placeholder="••••••••" 
              class="form-control password-control"
              [class.is-invalid]="signupForm.get('password')?.touched && signupForm.get('password')?.invalid"
            />
            <button 
              type="button" 
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
            >
              <span class="material-symbols-outlined">
                {{ showPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          class="signup-btn hover-shadow-solid"
          [disabled]="signupForm.invalid || loading"
        >
          {{ loading ? 'CREANDO...' : 'CREAR CUENTA' }}
        </button>
      </form>

      <p class="login-redirect">
        ¿Ya tienes una cuenta? <a routerLink="/auth/login">INICIAR SESIÓN</a>
      </p>
    </div>
  </div>
</div>
