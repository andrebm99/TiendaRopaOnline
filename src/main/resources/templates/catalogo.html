<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments :: head('Catálogo - Tienda de Ropa Online')}"></head>

<body>

    <!-- NAVBAR -->
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="catalog-main-container" id="catalogo-view">
        
        <!-- Page Title & Filter Bar -->
        <section class="catalog-header-section">
            <div class="catalog-header-top">
                <h1 class="catalog-title">Catálogo</h1>
                <span class="catalog-product-count">11 productos</span>
            </div>
            
            <div class="catalog-filters-wrapper">
                <div class="catalog-filters-group">
                    <span class="catalog-filter-label">Filtrar:</span>
                    <button class="catalog-filter-btn">
                        Tipo de producto <span class="material-symbols-outlined">expand_more</span>
                    </button>
                    <button class="catalog-filter-btn">
                        Tamaño <span class="material-symbols-outlined">expand_more</span>
                    </button>
                    <button class="catalog-filter-btn">
                        Más filtros <span class="material-symbols-outlined">expand_more</span>
                    </button>
                </div>
                <div class="catalog-filters-group">
                    <span class="catalog-filter-label">Ordenar por:</span>
                    <button class="catalog-filter-btn">
                        Relevancia <span class="material-symbols-outlined">expand_more</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Product Grid -->
        <section class="catalog-grid-section">
            <div class="catalog-grid">
                
                <!-- Product Card 1 -->
                <article class="catalog-product-card" th:onclick="|window.location.href='@{/}'|">
                    <div class="catalog-img-container">
                        <img alt="Blusa Lana Off White" class="catalog-product-img" th:src="@{/img/img1.jpeg}">
                        <div class="catalog-badges">
                            <span class="catalog-badge-primary">NEW DROP</span>
                        </div>
                        <div class="catalog-quick-add-wrapper">
                            <button class="catalog-quick-add-btn">
                                <span class="material-symbols-outlined">add</span> QUICK ADD
                            </button>
                        </div>
                    </div>
                    <div class="catalog-product-details">
                        <h3 class="catalog-product-title">Blusa Lana Off White</h3>
                        <p class="catalog-product-price">S/. 139.00 PEN</p>
                    </div>
                </article>

                <!-- Product Card 2 -->
                <article class="catalog-product-card" th:onclick="|window.location.href='@{/}'|">
                    <div class="catalog-img-container">
                        <img alt="Blusa Field Off White" class="catalog-product-img" th:src="@{/img/img2.jpeg}">
                        <div class="catalog-badges">
                            <span class="catalog-badge-surface">BEST SELLER</span>
                        </div>
                        <div class="catalog-quick-add-wrapper">
                            <button class="catalog-quick-add-btn">
                                <span class="material-symbols-outlined">add</span> QUICK ADD
                            </button>
                        </div>
                    </div>
                    <div class="catalog-product-details">
                        <h3 class="catalog-product-title">Blusa Field Off White</h3>
                        <p class="catalog-product-price">S/. 139.00 PEN</p>
                    </div>
                </article>

                <!-- Product Card 3 -->
                <article class="catalog-product-card" th:onclick="|window.location.href='@{/}'|">
                    <div class="catalog-img-container">
                        <img alt="Vestido Midi Noir" class="catalog-product-img" th:src="@{/img/img3.jpg}">
                        <div class="catalog-quick-add-wrapper">
                            <button class="catalog-quick-add-btn">
                                <span class="material-symbols-outlined">add</span> QUICK ADD
                            </button>
                        </div>
                    </div>
                    <div class="catalog-product-details">
                        <h3 class="catalog-product-title">Vestido Midi Noir</h3>
                        <p class="catalog-product-price">S/. 189.00 PEN</p>
                    </div>
                </article>

                <!-- Product Card 4 -->
                <article class="catalog-product-card" th:onclick="|window.location.href='@{/}'|">
                    <div class="catalog-img-container">
                        <img alt="Top Knit Nude" class="catalog-product-img" th:src="@{/img/img4.jpg}">
                        <div class="catalog-quick-add-wrapper">
                            <button class="catalog-quick-add-btn">
                                <span class="material-symbols-outlined">add</span> QUICK ADD
                            </button>
                        </div>
                    </div>
                    <div class="catalog-product-details">
                        <h3 class="catalog-product-title">Top Knit Nude</h3>
                        <p class="catalog-product-price bold-primary">S/. 99.00 PEN</p>
                    </div>
                </article>

            </div>
            
            <!-- Load More Action -->
            <div class="catalog-load-more-wrapper">
                <button class="catalog-load-more-btn">
                    Cargar más productos
                </button>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
