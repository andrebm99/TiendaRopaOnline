<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments :: head('Tu Bolsa de Compras - Tienda de Ropa Online')}"></head>

<body>

    <!-- NAVBAR -->
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="bolsa-main-container" id="bolsa-view">
        
        <!-- Header -->
        <div class="bolsa-header">
            <h1 class="bolsa-title">TU BOLSA DE COMPRAS</h1>
            <a class="bolsa-continue-link" th:href="@{/catalogo}">Seguir Comprando</a>
        </div>

        <!-- Cart Table -->
        <div class="bolsa-table-container">
            
            <!-- Header Row -->
            <div class="bolsa-table-header">
                <div class="bolsa-table-header-col">Producto</div>
                <div class="bolsa-table-header-col">Cantidad</div>
                <div class="bolsa-table-header-col">Total</div>
            </div>

            <!-- Cart Item -->
            <div class="bolsa-item-row">
                
                <!-- Product Info -->
                <div class="bolsa-item-info">
                    <div class="bolsa-item-img-wrap">
                        <img alt="Abrigo Tanner Negro" class="bolsa-item-img" th:src="@{/img/img1.jpeg}">
                    </div>
                    <div class="bolsa-item-details">
                        <h3 class="bolsa-item-title">Abrigo Tanner Negro</h3>
                        <p class="bolsa-item-price">S/ 269.00</p>
                        <div class="bolsa-item-size-badge">
                            <span>Talla: L</span>
                        </div>
                    </div>
                </div>

                <!-- Quantity -->
                <div class="bolsa-item-quantity">
                    <span class="bolsa-item-quantity-label">Cantidad</span>
                    <div class="bolsa-quantity-selector">
                        <button class="bolsa-quantity-btn minus">-</button>
                        <input class="bolsa-quantity-input" min="1" readonly type="number" value="1">
                        <button class="bolsa-quantity-btn plus">+</button>
                    </div>
                    <button class="bolsa-item-delete mobile">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                </div>

                <!-- Total & Actions -->
                <div class="bolsa-item-total">
                    <span class="bolsa-item-quantity-label">Total</span>
                    <div style="display: flex; align-items: center; gap: 24px;">
                        <span class="bolsa-item-total-val">S/ 269.00</span>
                        <button class="bolsa-item-delete desktop">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </div>
                </div>

            </div>

        </div>

        <!-- Shipping Calculator & Payment Summary -->
        <div class="bolsa-bottom-grid">
            
            <!-- Shipping Calculator -->
            <div class="bolsa-shipping-calc">
                <h2 class="bolsa-shipping-title">ESTIMAR ENVÍO</h2>
                <form class="bolsa-shipping-form">
                    <div class="bolsa-form-group">
                        <label class="bolsa-form-label">País</label>
                        <select class="bolsa-form-select">
                            <option>Perú</option>
                            <option>Chile</option>
                            <option>Colombia</option>
                        </select>
                    </div>
                    <div class="bolsa-form-group">
                        <label class="bolsa-form-label">Provincia</label>
                        <select class="bolsa-form-select">
                            <option>Lima Metropolitana</option>
                            <option>Arequipa</option>
                            <option>Cusco</option>
                        </select>
                    </div>
                    <div class="bolsa-form-group">
                        <label class="bolsa-form-label">Código Postal</label>
                        <input class="bolsa-form-input" type="text" value="15076">
                    </div>
                    <div class="bolsa-calc-btn-wrap">
                        <button class="bolsa-calc-btn" type="button">CALCULAR</button>
                    </div>
                </form>
            </div>

            <!-- Payment Summary -->
            <div class="bolsa-payment-summary">
                <div class="bolsa-payment-details">
                    <h2 class="bolsa-payment-label">Total estimado</h2>
                    <p class="bolsa-payment-total">S/ 269.00 <span>PEN</span></p>
                    <p class="bolsa-payment-note">Impuestos incluidos. Los gastos de envío se calculan en la pantalla de pago.</p>
                </div>
                <button class="bolsa-pay-btn">PAGAR PEDIDO</button>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
